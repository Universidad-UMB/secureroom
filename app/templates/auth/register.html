{% extends "base.html" %}

{% block title %}Crear Cuenta — SecureRoom{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-inner">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Registro de Usuario</h2>
      <p class="text-sm text-slate-500 mt-1">Crea una cuenta para reservar salas en SecureRoom</p>
    </div>

    <form action="/register" method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nombre completo</label>
        <input type="text" id="name" name="name" required autocomplete="name"
          value="{{ name or '' }}"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="Juan Pérez">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email"
          value="{{ email or '' }}"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="tu.correo@ejemplo.com">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="Mínimo 10 caracteres">
        <p class="text-xs text-slate-400 mt-1">Debe contener al menos 10 caracteres.</p>
      </div>

      <div>
        <label for="password_confirmation" class="block text-sm font-medium text-slate-700 mb-1">Confirmar contraseña</label>
        <input type="password" id="password_confirmation" name="password_confirmation" required autocomplete="new-password"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="Repita la contraseña">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm shadow-md transition duration-150">
          Crear Cuenta
        </button>
      </div>
    </form>

    <div class="mt-6 text-center border-t border-slate-100 pt-5">
      <p class="text-sm text-slate-600">
        ¿Ya tienes una cuenta?
        <a href="/login" class="font-medium text-brand-600 hover:text-brand-500">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
