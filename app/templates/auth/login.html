{% extends "base.html" %}

{% block title %}Iniciar Sesión — SecureRoom{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-inner">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Iniciar Sesión</h2>
      <p class="text-sm text-slate-500 mt-1">Accede a tu cuenta para gestionar reservas</p>
    </div>

    <form action="/login" method="POST" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email"
          value="{{ email or '' }}"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="tu.correo@ejemplo.com">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-900 shadow-sm"
          placeholder="••••••••••••">
      </div>

      <div>
        <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm shadow-md transition duration-150">
          Entrar a SecureRoom
        </button>
      </div>
    </form>

    <div class="mt-6 text-center border-t border-slate-100 pt-5">
      <p class="text-sm text-slate-600">
        ¿No tienes cuenta?
        <a href="/register" class="font-medium text-brand-600 hover:text-brand-500">Regístrate aquí</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
