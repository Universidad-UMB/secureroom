{% extends "base.html" %}

{% block title %}Nueva Reserva — SecureRoom{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Crear Nueva Reserva</h1>
      <p class="text-sm text-slate-500 mt-1">Selecciona una sala activa y define el horario de tu reunión</p>
    </div>

    <form action="/reservations" method="POST" class="space-y-6" id="reservation-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="room_id" class="block text-sm font-medium text-slate-700 mb-1">Sala de reunión</label>
        <select id="room_id" name="room_id" required
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 bg-white shadow-sm">
          <option value="" disabled {% if not selected_room_id %}selected{% endif %}>Selecciona una sala...</option>
          {% for r in rooms %}
            <option value="{{ r.id }}" {% if selected_room_id and selected_room_id == str(r.id) %}selected{% endif %}>
              {{ r.name }} (Capacidad: {{ r.capacity }} pers. - {{ r.location }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="start_datetime" class="block text-sm font-medium text-slate-700 mb-1">Fecha y hora de inicio</label>
          <input type="datetime-local" id="start_datetime" name="start_datetime" required
            value="{{ default_start or '' }}"
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 shadow-sm">
        </div>

        <div>
          <label for="end_datetime" class="block text-sm font-medium text-slate-700 mb-1">Fecha y hora de fin</label>
          <input type="datetime-local" id="end_datetime" name="end_datetime" required
            value="{{ default_end or '' }}"
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 shadow-sm">
        </div>
      </div>

      <!-- Live availability checker widget -->
      <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Verificación previa</span>
          <button type="button" id="btn-check-availability" class="text-xs font-semibold text-brand-600 hover:text-brand-700 bg-white px-3 py-1.5 border border-slate-200 rounded-md shadow-sm transition">
            Comprobar disponibilidad
          </button>
        </div>
        <div id="availability-result" class="hidden text-sm"></div>
      </div>

      <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
        <a href="/reservations" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition">
          Cancelar
        </a>
        <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-lg shadow-sm transition">
          Confirmar Reserva
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
