{% extends "base.html" %}

{% block title %}Error — SecureRoom{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-12 text-center">
  <div class="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 text-rose-600">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-slate-900 mb-2">{{ status_code }} — {{ title or "Ha ocurrido un error" }}</h1>
  <p class="text-slate-600 mb-6">{{ message or "La solicitud no pudo procesarse correctamente." }}</p>
  <div>
    <a href="{% if current_user %}/dashboard{% else %}/login{% endif %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg shadow-sm text-white bg-brand-600 hover:bg-brand-700 transition">
      Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
